services:
  postgres-catalog:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: db_catalog
      POSTGRES_USER: ${PG_CATALOG_USER:-catalog_user}
      POSTGRES_PASSWORD: ${PG_CATALOG_PASSWORD:?required -> set PG_CATALOG_PASSWORD in .env, see .env.example}
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata-catalog:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-order:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: db_order
      POSTGRES_USER: ${PG_ORDER_USER:-order_user}
      POSTGRES_PASSWORD: ${PG_ORDER_PASSWORD:?required - set PG_ORDER_PASSWORD in .env, see .env.example}
    ports: ["127.0.0.1:5434:5432"]
    volumes: [pgdata-order:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?required - set KEYCLOAK_ADMIN_PASSWORD in .env, see .env.example}
      KC_HEALTH_ENABLED: "true"

      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      ORDER_CLIENT_SECRET: ${ORDER_CLIENT_SECRET:?required - set ORDER_CLIENT_SECRET in .env, see .env.example}
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    ports: ["8080:8080"]
    healthcheck:
      # The management port (9000) serves health in Keycloak 25+; curl is absent
      # from the image, so Bash opens a TCP connection directly. Connection:
      # close matters: without it the check waits on HTTP keep-alive until
      # Docker kills the otherwise successful request at its timeout.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  catalog-service:
    build:
      context: ./backend/catalog-service
    environment:
      SPRING_PROFILES_ACTIVE: docker,demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-catalog:5432/db_catalog
      SPRING_DATASOURCE_USERNAME: ${PG_CATALOG_USER:-catalog_user}
      SPRING_DATASOURCE_PASSWORD: ${PG_CATALOG_PASSWORD:?required - set PG_CATALOG_PASSWORD in .env, see .env.example}
      VOLT_KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/volt
      VOLT_KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/volt/protocol/openid-connect/certs
    ports: ["8081:8081"]
    depends_on:
      postgres-catalog: { condition: service_healthy }
      keycloak:         { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  order-service:
    build:
      context: ./backend/order-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-order:5432/db_order
      SPRING_DATASOURCE_USERNAME: ${PG_ORDER_USER:-order_user}
      SPRING_DATASOURCE_PASSWORD: ${PG_ORDER_PASSWORD:?required - set PG_ORDER_PASSWORD in .env, see .env.example}
      VOLT_KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/volt
      VOLT_KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/volt/protocol/openid-connect/certs
      VOLT_CATALOG_BASE_URL: http://catalog-service:8081
      VOLT_CATALOG_TOKEN_URI: http://keycloak:8080/realms/volt/protocol/openid-connect/token
      VOLT_CATALOG_CLIENT_ID: volt-order
      VOLT_CATALOG_CLIENT_SECRET: ${ORDER_CLIENT_SECRET:?required - set ORDER_CLIENT_SECRET in .env, see .env.example}
    ports: ["8082:8082"]
    depends_on:
      postgres-order:  { condition: service_healthy }
      keycloak:        { condition: service_healthy }
      catalog-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_KEYCLOAK_URL: http://localhost:8080
        VITE_KEYCLOAK_REALM: volt
        VITE_KEYCLOAK_CLIENT_ID: volt-web
    ports: ["5173:80"]
    depends_on:
      catalog-service: { condition: service_healthy }
      order-service:   { condition: service_healthy }

volumes:
  pgdata-catalog:
  pgdata-order:
